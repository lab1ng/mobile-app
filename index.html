
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>morrow iPhone</title>
<style>
:root {
  --ink:#202126;
  --muted:#8e8e93;
  --line:#e9e9ed;
  --blue:#087cff;
  --paper:#fff;
}
* { box-sizing:border-box; }
body {
  margin:0; background:#e6e7ec; color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button,input,textarea { font:inherit; }
button { cursor:pointer; -webkit-tap-highlight-color:transparent; }
button:focus-visible,input:focus-visible,textarea:focus-visible {
  outline:2px solid #5298ff; outline-offset:2px;
}
.phone {
  width:min(393px,100vw);
  height:min(852px,100dvh);
  min-height:560px;
  margin:16px auto;
  background:#fff;
  border:7px solid #242428;
  border-radius:46px;
  overflow:hidden;
  position:relative;
  box-shadow:0 18px 55px #0002;
  isolation:isolate;
}
.status {
  height:36px; flex-shrink:0;
  padding:9px 24px 0;
  display:flex; justify-content:space-between;
  align-items:flex-start;
  font-size:12px; font-weight:700;
  position:relative; z-index:3;
}
.status-icons { letter-spacing:1px; }
#stage {
  position:absolute; inset:0;
  overflow:hidden; background:white;
}
.screen {
  position:absolute; inset:0;
  display:none; flex-direction:column;
  overflow:hidden; background:white;
}
.screen.active { display:flex; }
.status.on-wallpaper { color:white; }
.lock-screen {
  color:white;
  background:linear-gradient(180deg,#8396b6 0%,#c1c9d6 32%,#e1d8d2 57%,#8996ad 100%);
  align-items:center;
  text-align:center;
  padding:85px 22px 24px;
}
.lock-date { font-size:16px; font-weight:500; margin-top:34px; }
.lock-clock {
  font-size:86px; line-height:1.05;
  font-weight:300; letter-spacing:-5px; margin-top:2px;
}
.lock-subtitle { margin-top:12px; font-size:13px; color:#ffffffdf; }
.lock-spacer { flex:1; }
.lock-notification {
  width:100%; border-radius:17px;
  background:#ffffff36; backdrop-filter:blur(18px);
  padding:13px 15px; text-align:left;
  font-size:13px; margin-bottom:16px;
}
.lock-notification strong { display:block; margin-bottom:4px; }
.lock-bottom {
  width:100%; display:flex; align-items:center;
  justify-content:space-between; padding:0 8px 9px;
}
.round-control {
  width:47px; height:47px; border-radius:50%;
  background:#ffffff35; color:white;
  border:1px solid #ffffff50; font-size:20px;
  display:grid; place-items:center;
}
.lock-hint { font-size:12px; color:#ffffffed; }
.home-screen {
  color:white;
  background:linear-gradient(150deg,#a8c4d9 0%,#d9c8d9 44%,#a5b4d2 100%);
}
.home-inner {
  flex:1; overflow-y:auto; padding:48px 17px 14px;
  scrollbar-width:none;
}
.home-inner::-webkit-scrollbar { display:none; }
.home-date { font-size:14px; font-weight:600; margin-bottom:4px; }
.home-clock { font-size:33px; font-weight:650; letter-spacing:-1px; margin-bottom:25px; }
.app-grid {
  display:grid; grid-template-columns:repeat(4,minmax(0,1fr));
  gap:24px 10px;
}
.app-icon {
  border:0; background:none; color:white; padding:0;
  min-width:0; display:flex; flex-direction:column;
  align-items:center; gap:6px; font-size:10px;
  text-shadow:0 1px 4px #0004;
}
.app-tile {
  width:56px; height:56px; border-radius:14px;
  display:grid; place-items:center; font-size:30px;
  box-shadow:0 3px 9px #0001; text-shadow:none;
  position:relative;
}
.app-tile.social { background:linear-gradient(135deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5); color:white; }
.app-tile.messages { background:linear-gradient(#65df83,#24bb59); color:white; }
.app-tile.photos { background:white; }
.app-tile.settings { background:linear-gradient(#d8dbe2,#9299a6); }
.app-tile.notes { background:linear-gradient(#fff 0 23%,#f6d64d 23% 100%); }
.app-tile.phone { background:linear-gradient(#65df83,#24bb59); color:white; }
.app-tile.calendar { background:white; color:#222; }
.app-tile.calendar b { color:#e34d4d; font-size:9px; display:block; }
.app-tile.calendar strong { font-size:24px; line-height:1.1; }
.dock {
  margin:8px 12px 12px; padding:13px 10px;
  border-radius:25px; background:#ffffff4b;
  backdrop-filter:blur(20px);
  display:grid; grid-template-columns:repeat(4,1fr);
  gap:8px;
}
.dock .app-icon { gap:0; }
.dock .app-tile { width:52px; height:52px; }
.app-top {
  min-height:64px; flex-shrink:0;
  display:flex; align-items:center; justify-content:space-between;
  padding:13px 17px 8px;
  border-bottom:1px solid var(--line);
}
.app-title { font-size:21px; font-weight:750; letter-spacing:-.6px; }
.top-button {
  border:0; background:none; color:var(--blue);
  font-size:14px; padding:5px;
}
.app-body { flex:1; overflow-y:auto; padding:15px; scrollbar-width:none; }
.app-body::-webkit-scrollbar { display:none; }
.home-indicator-area {
  height:29px; flex-shrink:0; display:flex;
  align-items:center; justify-content:center;
  background:inherit;
}
.home-indicator {
  width:118px; height:4px; border-radius:9px;
  border:0; padding:0; background:#171717;
}
.home-indicator.light { background:white; }
.app-nav {
  height:54px; flex-shrink:0; border-top:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-around;
  background:#fff;
}
.app-nav button {
  border:0; background:white; color:#606066;
  display:flex; flex-direction:column; align-items:center; gap:2px;
  font-size:20px; min-width:48px;
}
.app-nav small { font-size:9px; }
.feed-story-row {
  display:flex; gap:14px; overflow-x:auto;
  padding:0 0 15px; border-bottom:1px solid var(--line);
  margin-bottom:14px; scrollbar-width:none;
}
.feed-story { border:0; background:white; padding:0; width:58px; flex:0 0 58px; font-size:10px; }
.story-ring {
  padding:3px; border-radius:50%;
  background:linear-gradient(35deg,#ffc84a,#f23c78,#9234c7);
  margin-bottom:5px;
}
.story-face {
  border:2px solid white; width:52px; height:52px;
  border-radius:50%; display:grid; place-items:center;
  background:#eee8ff; font-size:23px;
}
.feed-post { border-bottom:1px solid var(--line); padding-bottom:15px; margin-bottom:15px; }
.post-user { display:flex; align-items:center; gap:9px; margin-bottom:10px; }
.mini-avatar {
  width:35px; height:35px; border-radius:50%;
  display:grid; place-items:center; background:#f1e6ff;
  font-size:20px; flex-shrink:0;
}
.user-meta { flex:1; min-width:0; }
.user-meta strong { font-size:12px; }
.user-meta small { display:block; font-size:10px; color:var(--muted); margin-top:3px; }
.post-art {
  width:100%; aspect-ratio:1/1; display:grid; place-items:center;
  font-size:82px; border-radius:3px; overflow:hidden;
  background:linear-gradient(135deg,#d6c9f0,#f3d3df,#f4dfbb);
}
.post-art.green { background:linear-gradient(135deg,#c6d7ca,#eee3d3,#b7c2ad); }
.post-art.rose { background:linear-gradient(135deg,#f1c1b7,#e4b7d1,#b8c7e7); }
.post-art img { width:100%; height:100%; object-fit:cover; }
.post-actions { display:flex; gap:14px; padding:8px 0 4px; align-items:center; }
.post-actions button { border:0; background:white; font-size:23px; padding:0; }
.post-copy { font-size:12px; line-height:1.6; white-space:pre-wrap; overflow-wrap:anywhere; }
.post-copy strong { margin-right:5px; }
.muted { color:var(--muted); font-size:12px; }
.field {
  width:100%; border:1px solid #e1e1e5; border-radius:11px;
  padding:12px; margin-bottom:10px; background:#fafafd; color:var(--ink);
}
textarea.field { resize:vertical; min-height:85px; }
.primary {
  border:0; background:var(--blue); color:white; border-radius:10px;
  padding:12px 14px; font-weight:650;
}
.secondary {
  border:1px solid #dedee3; background:white; color:var(--ink);
  border-radius:10px; padding:10px 12px;
}
.full { width:100%; }
.chat-row {
  width:100%; display:flex; align-items:center; gap:11px;
  border:0; border-bottom:1px solid var(--line);
  padding:12px 0; background:white; text-align:left;
}
.chat-info { flex:1; min-width:0; }
.chat-info strong { font-size:13px; }
.chat-info p { font-size:12px; color:var(--muted); margin:4px 0 0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.messages { display:flex; flex-direction:column; gap:8px; min-height:230px; }
.bubble {
  max-width:82%; width:fit-content; padding:10px 13px;
  border-radius:17px; background:#ededf2;
  font-size:13px; line-height:1.5; overflow-wrap:anywhere; white-space:pre-wrap;
}
.bubble.mine { align-self:flex-end; background:#087cff; color:white; }
.send-row { display:flex; gap:8px; margin-top:12px; }
.send-row .field { min-width:0; margin:0; border-radius:22px; }
.profile-row { display:flex; gap:18px; align-items:center; margin:8px 0 16px; }
.profile-avatar { width:76px; height:76px; border-radius:50%; background:#eee6ff; display:grid; place-items:center; font-size:38px; }
.profile-stats { flex:1; display:flex; justify-content:space-around; text-align:center; }
.profile-stats b { display:block; font-size:15px; }
.profile-stats span { font-size:10px; color:var(--muted); }
.grid-photos { display:grid; grid-template-columns:repeat(3,1fr); gap:2px; margin-top:16px; }
.grid-photo { aspect-ratio:1; border:0; padding:0; background:#eee3f4; display:grid; place-items:center; font-size:35px; overflow:hidden; }
.grid-photo img { width:100%; height:100%; object-fit:cover; }
.setting-row {
  display:flex; justify-content:space-between; align-items:center;
  padding:15px 0; border-bottom:1px solid var(--line); font-size:14px; gap:12px;
}
.setting-row input { width:95px; padding:7px; border:1px solid var(--line); border-radius:7px; }
.note-card {
  padding:12px; border-radius:12px; background:#fff9d9;
  border:1px solid #f0e5a5; margin-bottom:9px; font-size:13px; white-space:pre-wrap; overflow-wrap:anywhere;
}
.calendar-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:13px; }
.calendar-grid { display:grid; grid-template-columns:repeat(7,1fr); text-align:center; gap:3px; }
.calendar-grid span { padding:8px 0; font-size:12px; }
.calendar-grid .weekday { color:var(--muted); font-size:10px; }
.calendar-grid .today { background:var(--blue); color:white; border-radius:50%; }
.event { background:#e9f3ff; color:#155eaa; padding:10px; border-radius:10px; font-size:12px; margin-top:8px; }
.dial-display { min-height:90px; display:grid; place-items:center; font-size:30px; letter-spacing:2px; }
.dial-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; padding:8px 20px; }
.dial-key {
  width:65px; height:65px; margin:auto; border:0; border-radius:50%;
  background:#ededf1; font-size:24px; display:grid; place-items:center;
}
.dial-key small { font-size:9px; color:#555; display:block; margin-top:-10px; }
.call-button {
  display:block; margin:15px auto; border:0; border-radius:50%;
  width:62px; height:62px; color:white; background:#36bf62; font-size:25px;
}
.empty { text-align:center; color:var(--muted); padding:30px 10px; font-size:13px; }
#toast {
  position:absolute; z-index:20; left:50%; bottom:55px; transform:translateX(-50%);
  padding:10px 15px; border-radius:20px; background:#25252aee; color:white;
  font-size:12px; white-space:nowrap; display:none;
}
@media(max-width:420px) {
  .phone { width:100vw; height:100dvh; min-height:540px; margin:0; border:0; border-radius:0; box-shadow:none; }
}
  
/* 앱 아이콘 크기 수정 */
.home-screen .app-tile {
  width: 56px !important;
  height: 56px !important;
  min-width: 56px;
  min-height: 56px;
  max-width: 56px;
  max-height: 56px;
  flex: none;
  aspect-ratio: 1 / 1;
  box-sizing: border-box;
}

.home-screen .app-icon {
  width: auto;
  min-width: 0;
  height: auto;
  align-items: center;
  justify-items: center;
}

.home-screen .app-grid {
  align-items: start;
}

.home-screen .dock .app-tile {
  width: 52px !important;
  height: 52px !important;
  min-width: 52px;
  min-height: 52px;
}

/* 전화 앱 - 최근 통화 화면 */
.phone-recents {
  background: #000;
  color: #f5f5f7;
  min-height: 100%;
  height: 100%;
  padding: 8px 16px 100px;
  box-sizing: border-box;
  overflow-y: auto;
  scrollbar-width: none;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

.phone-recents::-webkit-scrollbar {
  display: none;
}

.phone-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 4px 0 24px;
}

.phone-toolbar > button {
  flex-shrink: 0;
  color: #f5f5f7;
  background: #1c1c1e;
  border: 1px solid #333;
  border-radius: 28px;
  min-width: 48px;
  height: 44px;
  padding: 0 12px;
  font-size: 14px;
}

.phone-filter {
  display: flex;
  padding: 4px;
  background: #1c1c1e;
  border: 1px solid #333;
  border-radius: 28px;
}

.phone-filter button {
  background: transparent;
  color: #f5f5f7;
  border: 0;
  border-radius: 24px;
  padding: 10px 12px;
  font-size: 13px;
  white-space: nowrap;
}

.phone-filter button.selected {
  background: #48484a;
}

.phone-toolbar .phone-menu {
  width: 44px;
  min-width: 44px;
  padding: 0;
  font-size: 20px;
}

.phone-heading {
  font-size: 30px;
  line-height: 1.2;
  letter-spacing: -1px;
  font-weight: 750;
  margin: 0 0 20px;
}

.phone-search {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 44px;
  padding: 0 14px;
  border-radius: 28px;
  background: #1c1c1e;
  margin-bottom: 16px;
  color: #a1a1a6;
}

.phone-search input {
  flex: 1;
  min-width: 0;
  width: 100%;
  background: transparent;
  border: 0;
  outline: 0;
  color: white;
  font-size: 16px;
}

.phone-search input::placeholder {
  color: #8e8e93;
}

.phone-call-row {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 76px;
  border-bottom: 1px solid #303034;
}

.phone-person {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: 1;
  min-width: 0;
  padding: 12px 0;
  border: 0;
  background: transparent;
  color: inherit;
  text-align: left;
}

.phone-avatar {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  width: 54px;
  height: 54px;
  border-radius: 50%;
  background: linear-gradient(145deg, #77718d, #302944);
  color: white;
  font-size: 23px;
  font-weight: 650;
}

.phone-person-info {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}

.phone-person-info strong {
  font-size: 16px;
}

.phone-person-info small {
  color: #8e8e93;
  font-size: 13px;
}

.phone-call-date {
  flex-shrink: 0;
  color: #8e8e93;
  font-size: 14px;
  white-space: nowrap;
}

.phone-info {
  flex-shrink: 0;
  width: 42px;
  height: 42px;
  border: 0;
  border-radius: 50%;
  background: #1c1c1e;
  color: #0a84ff;
  font-size: 26px;
}

.phone-tabbar {
  position: sticky;
  bottom: -1px;
  display: flex;
  justify-content: space-around;
  align-items: center;
  gap: 2px;
  margin: 16px -8px -88px;
  padding: 10px 4px 12px;
  border: 1px solid #38383a;
  border-radius: 28px;
  background: #202023f5;
  backdrop-filter: blur(20px);
}

.phone-tabbar button {
  display: flex;
  flex: 1;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  min-width: 0;
  padding: 4px 0;
  border: 0;
  background: transparent;
  color: #f5f5f7;
  font-size: 22px;
}

.phone-tabbar button small {
  font-size: 10px;
  white-space: nowrap;
}

.phone-tabbar button.active {
  color: #0a84ff;
}

/* 전화 앱 전체 화면 */
#appScreen.phone-fullscreen {
  background: #000 !important;
}

#appScreen.phone-fullscreen .app-top,
#appScreen.phone-fullscreen .app-nav {
  display: none !important;
}

#appScreen.phone-fullscreen .app-body {
  position: absolute;
  top: 56px;
  bottom: 82px;
  left: 0;
  right: 0;
  width: 100%;
  height: auto;
  max-height: none;
  padding: 0;
  margin: 0;
  background: #000;
  overflow: hidden;
}

#appScreen.phone-fullscreen .home-indicator-area {
  position: absolute;
  z-index: 20;
  bottom: 0;
  left: 0;
  right: 0;
  background: #000;
}

#appScreen.phone-fullscreen .status {
  position: relative;
  z-index: 21;
  background: #000;
  color: #fff;
}

</style>
</head>
<body>
<div class="phone">
  <div id="stage">
    <div class="screen active lock-screen" id="lockScreen">
      <div class="lock-date" id="lockDate">월요일, 10월 19일</div>
      <div class="lock-clock" id="lockClock">9:41</div>
      <div class="lock-subtitle">잠금 해제하여 시작하기</div>
      <div class="lock-spacer"></div>
      <div class="lock-notification">
        <strong>◉　알림</strong>
        morrow.에 새로운 하루가 기다리고 있어요.
      </div>
      <div class="lock-bottom">
        <button class="round-control" onclick="toast('카메라는 데모 화면입니다.')">◉</button>
        <button class="round-control" onclick="showPasscode()">↑</button>
      </div>
      <div class="lock-hint">위로 쓸어올려 잠금 해제</div>
    </div>

    <div class="screen" id="passScreen">
      <div class="status"><span id="passTime">9:41</span><span>●●●　Wi-Fi　▰</span></div>
      <div style="text-align:center;padding:42px 20px 10px">
        <div style="font-size:34px;margin-bottom:14px">🔒</div>
        <h2 style="font-size:22px;margin:0 0 9px">암호 입력</h2>
        <p class="muted" id="passMessage">iPhone을 잠금 해제하려면 암호를 입력하세요.</p>
      </div>
      <div id="passDots" style="display:flex;justify-content:center;gap:15px;padding:22px 0">
        <span class="pass-dot"></span><span class="pass-dot"></span><span class="pass-dot"></span>
        <span class="pass-dot"></span>
      </div>
      <div id="keypad" style="width:270px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:14px 20px">
        <button class="pass-key" onclick="digit('1')">1</button>
        <button class="pass-key" onclick="digit('2')">2</button>
        <button class="pass-key" onclick="digit('3')">3</button>
        <button class="pass-key" onclick="digit('4')">4</button>
        <button class="pass-key" onclick="digit('5')">5</button>
        <button class="pass-key" onclick="digit('6')">6</button>
        <button class="pass-key" onclick="digit('7')">7</button>
        <button class="pass-key" onclick="digit('8')">8</button>
        <button class="pass-key" onclick="digit('9')">9</button>
        <span></span><button class="pass-key" onclick="digit('0')">0</button>
        <button class="pass-delete" onclick="deleteDigit()">⌫</button>
      </div>
      <div style="margin-top:auto;padding:20px;display:flex;justify-content:space-between">
        <button class="top-button" onclick="showLock()">취소</button>
        <button class="top-button" onclick="clearPass()">지우기</button>
      </div>
      <div class="home-indicator-area"><button class="home-indicator" onclick="showLock()"></button></div>
    </div>

    <div class="screen home-screen" id="homeScreen">
      <div class="status"><span id="homeStatusTime">9:41</span><span>●●●　Wi-Fi　▰</span></div>
      <div class="home-inner">
        <div class="home-date" id="homeDate">월요일, 10월 19일</div>
        <div class="home-clock" id="homeClock">9:41</div>
        <div class="app-grid" id="appGrid"></div>
      </div>
      <div class="dock" id="dock"></div>
      <div class="home-indicator-area"><button class="home-indicator light" onclick="goHome()"></button></div>
    </div>

    <div class="screen" id="appScreen">
      <div class="status"><span id="appStatusTime">9:41</span><span>●●●　Wi-Fi　▰</span></div>
      <div class="app-top">
        <button class="top-button" id="backButton" onclick="goHome()">‹ 홈</button>
        <div class="app-title" id="appTitle">morrow.</div>

let lockTouchStartY = 0;

function setupLockSwipe() {
  const lockScreen = document.getElementById("lockScreen");
  if (!lockScreen || lockScreen.dataset.swipeReady) return;

  lockScreen.dataset.swipeReady = "true";

  lockScreen.addEventListener("touchstart", (event) => {
    lockTouchStartY = event.touches[0].clientY;
  }, { passive: true });

  lockScreen.addEventListener("touchend", (event) => {
    const endY = event.changedTouches[0].clientY;
    const distance = lockTouchStartY - endY;

    if (distance > 60) {
      showPasscode();
    }
  }, { passive: true });

let phoneSwipeStartX = 0;
let phoneSwipeStartY = 0;

function setupPhoneBackSwipe() {
  const screen = document.getElementById("appScreen");
  if (!screen || screen.dataset.backSwipeReady) return;

  screen.dataset.backSwipeReady = "true";

  screen.addEventListener("touchstart", (event) => {
    if (currentApp !== "phone") return;
    phoneSwipeStartX = event.changedTouches[0].clientX;
    phoneSwipeStartY = event.changedTouches[0].clientY;
  }, { passive: true });

  screen.addEventListener("touchend", (event) => {
    if (currentApp !== "phone") return;

    const dx = event.changedTouches[0].clientX - phoneSwipeStartX;
    const dy = event.changedTouches[0].clientY - phoneSwipeStartY;

    if (dx > 90 && Math.abs(dy) < 70) {
      goHome();
    }
  }, { passive: true });
}

              <button class="phone-info" onclick="toast('${c.name} · 통화 상세 정보')">ⓘ</button>
            </div>
          `).join("")}
      </div>

      ${tabBar}
    </div>`;
}

  
let phoneSearch = "";
let phoneFilter = "all";

function restorePhoneSearch() {
  const input = document.getElementById("phoneSearchInput");
  if (input) {
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);

function calendarHTML() {
  const monthNames=["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
  const first=new Date(currentYear,currentMonth,1).getDay();
  const days=new Date(currentYear,currentMonth+1,0).getDate();
  let cells="";
  for(let i=0;i<first;i++)cells+="<span></span>";
  for(let d=1;d<=days;d++) {
    const today=new Date();
    const cls=d===today.getDate()&&currentMonth===today.getMonth()&&currentYear===today.getFullYear()?"today":"";
    cells+=`<span class="${cls}">${d}</span>`;
  }
  return `<div class="calendar-head"><button class="secondary" onclick="changeMonth(-1)">‹</button><strong>${currentYear}년 ${monthNames[currentMonth]}</strong><button class="secondary" onclick="changeMonth(1)">›</button></div>
    <div class="calendar-grid">${["일","월","화","수","목","금","토"].map(x=>`<span class="weekday">${x}</span>`).join("")}${cells}</div>
    <h3 style="margin-top:22px">예정된 일정</h3>
    ${data.events.map(e=>`<div class="event"><strong>${esc(e.date)}</strong><br>${esc(e.title)}</div>`).join("")||'<p class="muted">아직 일정이 없어요.</p>'}
    <button class="primary full" onclick="addEvent()">＋ 일정 추가</button>`;
}
function changeMonth(n) {
  currentMonth+=n;
  if(currentMonth<0){currentMonth=11;currentYear--;}
  if(currentMonth>11){currentMonth=0;currentYear++;}
  renderApp();
}
function addEvent() {
  const title=prompt("일정 이름을 입력해 주세요.");
  if(!title||!title.trim())return;
  const date=prompt("날짜를 입력해 주세요. 예: 10월 25일","10월 "+new Date().getDate()+"일");
  if(date===null)return;
  data.events.push({title:title.trim(),date:date.trim()});persist();renderApp();
}
renderHome();
</script>
